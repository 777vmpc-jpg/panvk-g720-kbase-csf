name: Build PanVK G720 Kbase FPS

on:
  push:
    branches: [ "Desenvolvimento g720" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;27.0.12077973 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias - TUDO de uma vez
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip meson ninja-build pkg-config libdrm-dev flex bison clang-19 llvm-19 llvm-19-dev libclc-19-dev libclc-dev spirv-tools glslang-tools libglslang-dev libspirv-tools-dev libzstd-dev libexpat1-dev libelf-dev libx11-dev libxext-dev libxdamage-dev libxfixes-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libxxf86vm-dev libwayland-dev wayland-protocols gettext
          # Garante que o libclc seja achado em qualquer lugar
          sudo mkdir -p /usr/lib/libclc /usr/local/lib/libclc
          for D in /usr/lib/llvm-*/lib/clang/*/lib/ /usr/lib/llvm-*/lib/libclc/; do if [ -d "$D" ]; then sudo cp -r "$D"* /usr/lib/libclc/ 2>/dev/null || true; fi; done
          find /usr -name "*libclc*" 2>/dev/null | head -20
          pip3 install --upgrade meson mako pyyaml || true

      - name: Compilador PanVK G720
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-aarch64.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-android35-clang'
          cpp = 'aarch64-linux-android35-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          EOF
          export PATH=$TOOLCHAIN:$PATH
          # Limpa build antigo se existir
          rm -rf build-android
          # auto_features=disabled = desliga TUDO opcional de uma vez, nao precisa adivinhar nome de opcao
          # So liga o que o PanVK precisa
          meson setup build-android --cross-file android-aarch64.txt -Dgallium-drivers=panfrost -Dvulkan-drivers=panfrost -Dbuildtype=release -Dauto_features=disabled -Dllvm=enabled -Dshared-llvm=enabled
          # Compila com poucos jobs pra nao estourar memoria do runner
          ninja -C build-android -j2
          echo "=== Procurando o .so gerado ==="
          find build-android -name "*.so" | head -30

      - name: Driver Salvar
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-fps-kbase
          path: |
            build-android/src/panfrost/vulkan/libvulkan_panvk.so
            build-android/src/**/libvulkan_panvk.so
          if-no-files-found: warn
