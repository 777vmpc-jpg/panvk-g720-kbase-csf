name: Build PanVK G720 Kbase FPS

on:
  push:
    branches: [ "Desenvolvimento g720" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;27.0.12077973 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias - COMPLETO
        run: |
          sudo apt update
          sudo apt install -y git python3 python3-pip meson ninja-build pkg-config flex bison gettext wayland-protocols \
            libdrm-dev libclc-19-dev clang-19 llvm-19 llvm-19-dev libllvmspirvlib-19-dev llvm-spirv-19 \
            spirv-tools libspirv-tools-dev spirv-headers libspirv-headers-dev glslang-tools \
            libzstd-dev libexpat1-dev libelf-dev libudev-dev libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libxxf86vm-dev \
            libwayland-dev libxrandr-dev libxrender-dev libvulkan-dev libglvnd-dev libxml2-dev zlib1g-dev || true
          pip3 install --upgrade meson mako pyyaml || true

      - name: Compilador PanVK G720 - COMPLETO
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=/usr/lib/llvm-19/bin:$TOOLCHAIN:$PATH
          export LLVM_CONFIG=/usr/lib/llvm-19/bin/llvm-config
          export PKG_CONFIG_PATH=/usr/lib/llvm-19/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          llvm-config --version
          echo "=== OPCOES VALIDAS DO MESA ==="
          grep -E "option\(" meson_options.txt | head -n 100 || cat meson.build | head -n 20
          cat > android-aarch64.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-android35-clang'
          cpp = 'aarch64-linux-android35-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkg-config = 'pkg-config'
          llvm-config = '/usr/lib/llvm-19/bin/llvm-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = '/usr/lib/x86_64-linux-gnu/pkgconfig'
          EOF
          cat > native.txt << 'EOF'
          [binaries]
          c = 'cc'
          cpp = 'c++'
          ar = 'ar'
          strip = 'strip'
          llvm-config = '/usr/lib/llvm-19/bin/llvm-config'
          EOF
          rm -rf build-android
          meson setup build-android --cross-file android-aarch64.txt --native-file native.txt \
            -Dgallium-drivers=panfrost \
            -Dvulkan-drivers=panfrost \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dauto_features=disabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Dgallium-opencl=disabled \
            -Dopencl-spirv=false \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled
          ninja -C build-android -j2
          find build-android -name "*.so"
          ls -lh build-android/src/panfrost/vulkan/libvulkan_panvk.so
          test -f build-android/src/panfrost/vulkan/libvulkan_panvk.so || (echo "ERRO: .so nao criado" && exit 1)

      - name: Driver Salvar
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-fps-kbase
          path: build-android/src/panfrost/vulkan/libvulkan_panvk.so
          if-no-files-found: error
