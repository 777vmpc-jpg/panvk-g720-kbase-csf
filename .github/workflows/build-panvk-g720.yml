name: Build PanVK G720 Otimizado Faux123 Base

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar base + Mesa
        run: |
          git clone --depth 1 https://github.com/JICA98/panvk-kbase-android.git panvk-kbase-android
          cd panvk-kbase-android
          echo "=== Baixando Mesa 26.3.0-devel que faltava ==="
          git clone https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          git checkout 5a07217f034b3e50d8c7c7794f97a2df1742613b
          cd ..
          ls -la
          ls -la mesa/meson.build
          echo "=== Perfis ==="
          ls -R scripts/ | head -n 100

      - name: 2. Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk
