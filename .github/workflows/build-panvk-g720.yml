name: Build PanVK Mali G720 MC7 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - botw-mc7-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Integrar arvore Mesa com backend Kbase e CSF
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verificar a base antes de compilar as correcoes integradas
        shell: bash
        run: |
          set -euo pipefail
          test -s meson.build
          test -s src/panfrost/lib/kmod/kbase_kmod.c
          test -s src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c
          git diff --check HEAD

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget unzip zip xz-utils \
            pkg-config gettext-base \
            python3 python3-dev python3-venv python3-pip \
            cmake ninja-build \
            bison flex \
            clang llvm llvm-dev lld \
            libclang-dev \
            libclc-18 libclc-18-dev \
            libllvmspirvlib-18-dev spirv-tools \
            libdrm-dev libelf-dev \
            libexpat1-dev libzstd-dev zlib1g-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev \
            libxrandr-dev libxdamage-dev \
            libxfixes-dev libxext-dev \
            libxcb1-dev libxcb-randr0-dev \
            libxcb-dri3-dev libxcb-present-dev \
            libxcb-shm0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxshmfence-dev \
            libvulkan-dev libxml2-dev \
            libffi-dev libssl-dev \
            libedit-dev libncurses-dev \
            libudev-dev patchelf \
            glslang-tools

      - name: Instalar NDK r27
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/android-ndk-r27-linux.zip"
          ndk_dir="$RUNNER_TEMP/android-ndk-r27"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27-linux.zip \
            -o "$archive"
          echo "2f17eb8bcbfdc40201c0b36e9a70826fcd2524ab7a2a235e2c71186c302da1dc  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          grep -Eq '^Pkg.Revision *= *27\.0\.12077973$' "$ndk_dir/source.properties"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - name: Instalar Meson e ferramentas Python
        run: |
          python3 -m venv "$HOME/panvk-venv"

          "$HOME/panvk-venv/bin/pip" install --upgrade \
            pip setuptools wheel

          "$HOME/panvk-venv/bin/pip" install \
            "meson>=1.4,<2" \
            mako pyyaml ply packaging

          echo "$HOME/panvk-venv/bin" >> "$GITHUB_PATH"

      - name: Compilar e instalar libdrm 2.4.133 para o host
        shell: bash
        run: |
          set -euo pipefail

          LIBDRM_VERSION="2.4.133"
          ARCHIVE="libdrm-${LIBDRM_VERSION}.tar.xz"
          URL="https://dri.freedesktop.org/libdrm/${ARCHIVE}"
          SHA256="fc68f9d0ba2ea63c9432a299e14fea09fad7a8a66e8039fcd7802ca59f77b4f5"

          curl --fail --location --retry 3 "$URL" -o "/tmp/$ARCHIVE"
          echo "$SHA256  /tmp/$ARCHIVE" | sha256sum --check --status

          mkdir -p /tmp/libdrm-src
          tar -xf "/tmp/$ARCHIVE" -C /tmp/libdrm-src --strip-components=1

          meson setup /tmp/libdrm-src/build /tmp/libdrm-src \
            --prefix=/usr/local \
            --buildtype=release

          ninja -C /tmp/libdrm-src/build
          sudo ninja -C /tmp/libdrm-src/build install
          sudo ldconfig

          LIBDRM_PC="$(find /usr/local -type f -name libdrm.pc -print -quit)"
          if [ -z "$LIBDRM_PC" ]; then
            echo "libdrm.pc nao foi instalado"
            exit 1
          fi

          LIBDRM_PC_DIR="$(dirname "$LIBDRM_PC")"
          echo "PKG_CONFIG_PATH=$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --modversion libdrm
          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --atleast-version=2.4.133 libdrm

      - name: Compilar e validar o pacote Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          bash setup.sh
          python3 porting/mc7/package.py

      - name: Publicar ZIP do driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-Faux123-1.1.9-G720-MC7-ARM64
          path: output/PanVK-Faux123-1.1.9-G720-MC7-ARM64.zip
          if-no-files-found: error
          retention-days: 30
