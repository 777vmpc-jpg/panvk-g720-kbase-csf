name: Build PanVK G720 MC7 POCO X7 Pro - Completo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1 Baixar base G720
        run: |
          mkdir -p panvk-kbase-csf
          git clone --depth 1 https://github.com/JICA98/panvk-kbase-android.git panvk-kbase-csf/panvk-kbase-android
          cd panvk-kbase-csf/panvk-kbase-android
          ls -lh
          cat sources.lock || true
          ls -lh profiles/g720-v12-csf.json
          ls -lh patches/

      - name: 2 Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;29.0.14206865 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: 3 Instalar Meson e Ninja
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip meson ninja-build pkg-config flex bison gettext git patch
          pip3 install --upgrade meson mako pyyaml
          meson --version
          ninja --version

      - name: 4 Fetch + Aplicar Patches + Compilar G720 MC7 v12
        run: |
          cd panvk-kbase-csf/panvk-kbase-android
          if [ -f scripts/fetch-mesa.sh ]; then bash scripts/fetch-mesa.sh; fi
          ls -lh work/mesa/meson.build
          echo "=== APLICANDO PATCHES G720 ==="
          cd work/mesa
          git config user.email "builder@local"
          git config user.name "builder"
          for p in $(find ../../patches -name "*.patch" | sort); do echo "APLICANDO: $p"; git apply "$p" || patch -p1 < "$p" || echo "FALHOU MAS CONTINUA: $p"; done
          echo "=== CONFIRMA panfrost-kmds ==="
          grep -rn "panfrost-kmds" meson.options meson.build | head -n 20
          cd ../..
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          export CFLAGS=-O3
          export CXXFLAGS=-O3
          export LDFLAGS=-Wl,--strip-all
          bash scripts/build-android.sh --profile g720-v12-csf --api 35
          echo "=== RESULTADO G720 MC7 ==="
          find . -name libvulkan_panfrost.so
          find . -name "*.zip"

      - name: 5 Salvar driver G720 MC7
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-mc7-poco-x7-pro
          path: |
            panvk-kbase-csf/**/*.so
            panvk-kbase-csf/**/*.zip
          if-no-files-found: error
