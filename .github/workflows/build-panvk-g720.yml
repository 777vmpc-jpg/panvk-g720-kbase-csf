name: Build PanVK G720 Otimizado Faux123 Base

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar base + Mesa
        run: |
          git clone --depth 1 https://github.com/JICA98/panvk-kbase-android.git panvk-kbase-android
          cd panvk-kbase-android
          echo "=== Baixando Mesa 26.3.0-devel que faltava ==="
          git clone https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          git checkout 5a07217f034b3e50d8c7c7794f97a2df1742613b
          cd ..
          ls -la
          ls -la mesa/meson.build
          echo "=== Perfis ==="
          ls -R scripts/ | head -n 100

      - name: 2. Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;29.0.14206865 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: 3. Instalar Meson + Ninja
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip meson ninja-build pkg-config flex bison gettext git
          pip3 install --upgrade meson mako pyyaml
          meson --version
          ninja --version

      - name: 4. Compilar G720 v12 - POCO X7 Pro 8GB
        run: |
          cd panvk-kbase-android
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          export CFLAGS="-O3 -mcpu=cortex-a725 -flto=thin -fno-plt"
          export CXXFLAGS="-O3 -mcpu=cortex-a725 -flto=thin -fno-plt"
          export LDFLAGS="-flto=thin -Wl,--strip-all"
          bash scripts/build-android.sh --profile g720-v12-csf --api 35
          echo "=== RESULTADO ==="
          find . -name "*.so" -o -name "*.adpkg.zip" | head -n 20

      - name: 5. Salvar driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-otimizado
          path: |
            panvk-kbase-android/**/*.so
            panvk-kbase-android/**/*.zip
          if-no-files-found: error
