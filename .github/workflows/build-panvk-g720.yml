name: Build PanVK Mali G720 MC7 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget unzip zip xz-utils \
            pkg-config gettext-base \
            python3 python3-dev python3-venv python3-pip \
            cmake ninja-build \
            bison flex \
            clang llvm llvm-dev lld \
            libclang-dev \
            libdrm-dev libelf-dev \
            libexpat1-dev libzstd-dev zlib1g-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev \
            libxrandr-dev libxdamage-dev \
            libxfixes-dev libxext-dev \
            libxcb1-dev libxcb-randr0-dev \
            libxcb-dri3-dev libxcb-present-dev \
            libxcb-shm0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxshmfence-dev \
            libvulkan-dev libxml2-dev \
            libffi-dev libssl-dev \
            libedit-dev libncurses-dev \
            libudev-dev patchelf \
            glslang-tools

      - name: Instalar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Preparar caminho do NDK
        shell: bash
        run: |
          NDK_VERSION="27.0.12077973"
          mkdir -p "$HOME/Android/Sdk/ndk"

          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK nao encontrado"
            exit 1
          fi

          ln -sfn \
            "$ANDROID_HOME/ndk/$NDK_VERSION" \
            "$HOME/Android/Sdk/ndk/$NDK_VERSION"

          echo "ANDROID_NDK_HOME=$HOME/Android/Sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Instalar Meson e ferramentas Python
        run: |
          python3 -m venv "$HOME/panvk-venv"

          "$HOME/panvk-venv/bin/pip" install --upgrade \
            pip setuptools wheel

          "$HOME/panvk-venv/bin/pip" install \
            "meson>=1.4,<2" \
            mako pyyaml ply packaging

          echo "$HOME/panvk-venv/bin" >> "$GITHUB_PATH"

      - name: Instalar Rust e Cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verificar ferramentas
        run: |
          clang --version
          llvm-config --version
          meson --version
          ninja --version
          rustc --version
          cargo --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Verificar codigo-fonte
        shell: bash
        run: |
          set -euo pipefail

          for file in setup.sh android.toml meson.build; do
            if [ ! -f "$file" ]; then
              echo "Arquivo obrigatorio ausente: $file"
              exit 1
            fi
          done

          if [ ! -f src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c ]; then
            echo "Arquivo PanVK CSF nao encontrado."
            exit 1
          fi

      - name: Aplicar ajustes de heap MC7
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c")
          source = path.read_text()

          interval_old = "#define KBASE_TILER_HEAP_RENEW_INTERVAL 128"
          interval_new = "#define KBASE_TILER_HEAP_RENEW_INTERVAL 256"

          if interval_old in source:
              source = source.replace(interval_old, interval_new, 1)
              print("Aplicado:", interval_new)
          elif interval_new in source:
              print("Ja aplicado:", interval_new)
          else:
              raise SystemExit(
                  "Nao foi possivel localizar a definicao de INTERVAL"
              )

          work_old = "#define KBASE_TILER_HEAP_RENEW_WORK 65536"
          work_new = "#define KBASE_TILER_HEAP_RENEW_WORK 131072"

          if work_old in source:
              source = source.replace(work_old, work_new, 1)
              work_status = "131072 (aplicado)"
              print("Aplicado:", work_new)
          elif work_new in source:
              work_status = "131072 (ja aplicado)"
              print("Ja aplicado:", work_new)
          else:
              work_status = "Nao aplicado - macro ausente no codigo-fonte"
              print("Aviso: macro WORK nao encontrada; seguindo sem altera-la")

          path.write_text(source)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"HEAP_RENEW_WORK_STATUS={work_status}\n")
          PY

      - name: Preparar script de compilacao
        shell: bash
        run: |
          set -euo pipefail
          chmod +x setup.sh

      - name: Compilar PanVK ARM64
        shell: bash
        run: |
          set -euo pipefail

          bash ./setup.sh

          meson compile -C build

      - name: Localizar biblioteca compilada
        shell: bash
        run: |
          set -euo pipefail

          LIB="$(find build -type f \
            -name libvulkan_panfrost.so \
            -print -quit)"

          if [ -z "$LIB" ]; then
            echo "Biblioteca nao encontrada."
            exit 1
          fi

          mkdir -p output
          cp "$LIB" output/libvulkan_panfrost.so

          file output/libvulkan_panfrost.so
          sha256sum output/libvulkan_panfrost.so

          echo "Biblioteca compilada: $LIB"

      - name: Gerar informacoes do build
        run: |
          {
            echo "PanVK Mali G720 MC7"
            echo "Arquitetura: ARM64"
            echo "Android API: 30"
            echo "NDK: 27.0.12077973"
            echo "Heap renew interval: 256"
            echo "Heap renew work: $HEAP_RENEW_WORK_STATUS"
            echo ""
            echo "SHA256:"
            sha256sum output/libvulkan_panfrost.so
          } > output/BUILD-INFO.txt

      - name: Publicar biblioteca compilada
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-MC7-ARM64
          path: output/
          if-no-files-found: error
          retention-days: 30
