name: Build PanVK Mali G720 MC7 ARM64

on:
  workflow_dispatch:
  pull_request:
    branches:
      - g720-development
  push:
    branches:
      - g720-development
      - auto-build-mc7-v1.1.9f
      - panvk/mc7-botw-peanuts-candidate

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget unzip zip xz-utils \
            pkg-config gettext-base \
            python3 python3-dev python3-venv python3-pip \
            cmake ninja-build \
            bison flex \
            clang llvm llvm-dev lld \
            libclang-dev \
            libclc-18 libclc-18-dev \
            libllvmspirvlib-18-dev \
            libdrm-dev libelf-dev \
            libexpat1-dev libzstd-dev zlib1g-dev \
            libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev \
            libxrandr-dev libxdamage-dev \
            libxfixes-dev libxext-dev \
            libxcb1-dev libxcb-randr0-dev \
            libxcb-dri3-dev libxcb-present-dev \
            libxcb-shm0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxshmfence-dev \
            libvulkan-dev libxml2-dev \
            libffi-dev libssl-dev \
            libedit-dev libncurses-dev \
            libudev-dev patchelf \
            glslang-tools

      - name: Instalar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Preparar caminho do NDK
        shell: bash
        run: |
          NDK_VERSION="27.0.12077973"
          mkdir -p "$HOME/Android/Sdk/ndk"

          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK nao encontrado"
            exit 1
          fi

          ln -sfn \
            "$ANDROID_HOME/ndk/$NDK_VERSION" \
            "$HOME/Android/Sdk/ndk/$NDK_VERSION"

          echo "ANDROID_NDK_HOME=$HOME/Android/Sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Instalar Meson e ferramentas Python
        run: |
          python3 -m venv "$HOME/panvk-venv"

          "$HOME/panvk-venv/bin/pip" install --upgrade \
            pip setuptools wheel

          "$HOME/panvk-venv/bin/pip" install \
            "meson>=1.4,<2" \
            mako pyyaml ply packaging

          echo "$HOME/panvk-venv/bin" >> "$GITHUB_PATH"

      - name: Compilar e instalar libdrm 2.4.133 para o host
        shell: bash
        run: |
          set -euo pipefail

          LIBDRM_VERSION="2.4.133"
          ARCHIVE="libdrm-${LIBDRM_VERSION}.tar.xz"
          URL="https://dri.freedesktop.org/libdrm/${ARCHIVE}"
          SHA256="fc68f9d0ba2ea63c9432a299e14fea09fad7a8a66e8039fcd7802ca59f77b4f5"

          curl --fail --location --retry 3 "$URL" -o "/tmp/$ARCHIVE"
          echo "$SHA256  /tmp/$ARCHIVE" | sha256sum --check --status

          mkdir -p /tmp/libdrm-src
          tar -xf "/tmp/$ARCHIVE" -C /tmp/libdrm-src --strip-components=1

          meson setup /tmp/libdrm-src/build /tmp/libdrm-src \
            --prefix=/usr/local \
            --buildtype=release

          ninja -C /tmp/libdrm-src/build
          sudo ninja -C /tmp/libdrm-src/build install
          sudo ldconfig

          LIBDRM_PC="$(find /usr/local -type f -name libdrm.pc -print -quit)"
          if [ -z "$LIBDRM_PC" ]; then
            echo "libdrm.pc nao foi instalado"
            exit 1
          fi

          LIBDRM_PC_DIR="$(dirname "$LIBDRM_PC")"
          echo "PKG_CONFIG_PATH=$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --modversion libdrm
          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --atleast-version=2.4.133 libdrm

      - name: Instalar Rust e Cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar bindgen para o Mesa
        shell: bash
        run: |
          set -euo pipefail

          # O Mesa atual exige bindgen 0.71.1 ou superior.
          cargo install --locked bindgen-cli --version 0.72.1

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

          "$HOME/.cargo/bin/bindgen" --version

      - name: Verificar ferramentas
        run: |
          clang --version
          llvm-config --version
          meson --version
          ninja --version
          rustc --version
          cargo --version
          bindgen --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Verificar codigo-fonte
        shell: bash
        run: |
          set -euo pipefail

          for file in setup.sh android.toml meson.build; do
            if [ ! -f "$file" ]; then
              echo "Arquivo obrigatorio ausente: $file"
              exit 1
            fi
          done

          if [ ! -f src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c ]; then
            echo "Arquivo PanVK CSF nao encontrado."
            exit 1
          fi

      - name: Auditar parametros de heap MC7 sem alterar o codigo
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c"
          grep -E '^#define KBASE_TILER_HEAP_RENEW_(INTERVAL|WORK) ' "$SOURCE" | tee output-heap.txt
          INTERVAL="$(awk '/KBASE_TILER_HEAP_RENEW_INTERVAL / {print $3}' "$SOURCE")"
          WORK="$(awk '/KBASE_TILER_HEAP_RENEW_WORK / {print $3}' "$SOURCE")"
          echo "HEAP_RENEW_INTERVAL=$INTERVAL" >> "$GITHUB_ENV"
          echo "HEAP_RENEW_WORK=$WORK" >> "$GITHUB_ENV"

      - name: Preparar script de compilacao
        shell: bash
        run: |
          set -euo pipefail
          chmod +x setup.sh

      - name: Compilar PanVK ARM64
        shell: bash
        run: |
          set -euo pipefail

          bash ./setup.sh

          meson compile -C build

      - name: Localizar biblioteca compilada
        shell: bash
        run: |
          set -euo pipefail

          LIB="$(find build -type f \
            -name libvulkan_panfrost.so \
            -print -quit)"

          if [ -z "$LIB" ]; then
            echo "Biblioteca nao encontrada."
            exit 1
          fi

          mkdir -p output
          cp "$LIB" output/libvulkan_panfrost.so

          file output/libvulkan_panfrost.so
          sha256sum output/libvulkan_panfrost.so

          echo "Biblioteca compilada: $LIB"

      - name: Gerar informacoes do build
        run: |
          {
            echo "PanVK Mali G720 MC7"
            echo "Arquitetura: ARM64"
            echo "Android API: 30"
            echo "NDK: 27.0.12077973"
            echo "Heap renew interval: $HEAP_RENEW_INTERVAL"
            echo "Heap renew work: $HEAP_RENEW_WORK"
            echo ""
            echo "SHA256:"
            sha256sum output/libvulkan_panfrost.so
          } > output/BUILD-INFO.txt


      - name: Empacotar ZIP de teste MC7
        shell: bash
        run: |
          set -euo pipefail
          cp output-heap.txt output/HEAP-SETTINGS.txt
          readelf -h output/libvulkan_panfrost.so | grep -E 'Machine:.*AArch64'
          nm -D --defined-only output/libvulkan_panfrost.so > output/ELF-SYMBOLS.txt
          grep -E '[[:space:]]T[[:space:]]vk_icdGetInstanceProcAddr$' output/ELF-SYMBOLS.txt
          grep -E '[[:space:]]D[[:space:]]HMI$' output/ELF-SYMBOLS.txt
          readelf -d output/libvulkan_panfrost.so > output/ELF-DYNAMIC.txt
          if grep -Ei 'NEEDED.*lib(x11|xcb|xshmfence|xrandr)' output/ELF-DYNAMIC.txt; then
            exit 1
          fi
          cat > output/meta.json <<'JSON'
          {
            "schemaVersion": 1,
            "name": "PanVK G720 MC7 BOTW + Peanuts ICD Fix 2",
            "packageVersion": "1.1.9-botw-peanuts-icd-fix-2",
            "driverVersion": "26.3.0-devel",
            "vendor": "Mesa / PanVK",
            "minApi": 30,
            "libraryName": "libvulkan_panfrost.so"
          }
          JSON
          python3 -m json.tool output/meta.json >/dev/null
          (cd output && zip -9 PanVK-G720-MC7-ARM64.zip libvulkan_panfrost.so meta.json BUILD-INFO.txt HEAP-SETTINGS.txt)
          unzip -t output/PanVK-G720-MC7-ARM64.zip
          sha256sum output/PanVK-G720-MC7-ARM64.zip

      - name: Publicar biblioteca compilada
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-MC7-ARM64
          path: output/PanVK-G720-MC7-ARM64.zip
          if-no-files-found: error
          retention-days: 30
