name: Build PanVK G720 Kbase FPS

on:
  push:
    branches: [ "Desenvolvimento g720" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Instalar NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;27.0.12077973 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y git python3 meson ninja-build pkg-config libdrm-dev flex bison

      - name: Compilador PanVK G720
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cat > android-aarch64.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-android35-clang'
          cpp = 'aarch64-linux-android35-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = true
          EOF
          export PATH=$TOOLCHAIN:$PATH
          # Acha o arquivo de opcoes certo dessa versao: meson.options ou meson_options.txt
          OPTFILE=""
          if [ -f meson.options ]; then OPTFILE="meson.options"; elif [ -f meson_options.txt ]; then OPTFILE="meson_options.txt"; fi
          echo "Arquivo de opcoes: $OPTFILE"
          ARGS="-Dgallium-drivers=panfrost -Dvulkan-drivers=panfrost -Dbuildtype=release -Dopencl=disabled -Drusticl=false"
          for OPT in "opencl-spirv=false" "gallium-va=disabled" "gallium-vdpau=disabled" "gallium-xa=disabled" "gallium-media=disabled" "egl=disabled" "gbm=disabled" "glx=disabled" "opengl=false" "gles1=disabled" "gles2=disabled"; do
            NAME=$(echo $OPT | cut -d= -f1)
            if [ -n "$OPTFILE" ] && grep -q "'$NAME'" "$OPTFILE"; then ARGS="$ARGS -D$OPT"; fi
          done
          echo "Usando: $ARGS"
          meson setup build-android --cross-file android-aarch64.txt $ARGS
          ninja -C build-android

      - name: Driver Salvar
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g720-fps-kbase
          path: build-android/src/panfrost/vulkan/libvulkan_panvk.so
