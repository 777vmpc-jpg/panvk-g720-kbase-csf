name: Build PanVK Mali G720 MC7 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-wayland-egl-backend-mc7
      - integrate-faux123-192-mc7
      - kakarot-placed-memory
      - kakarot-display-diagnostics
      - kakarot-ahb-libandroid-fdprobe
      - panvk/version20-restored

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verificar fonte publica PanVK kbase
        shell: bash
        run: |
          set -euo pipefail
          SRC="vendor/panvk-kbase-android-public"
          test -f "$SRC/sources.lock"
          test -d "$SRC/patches"
          EXPECTED="cf70e02b918e1864cbcd746a7fefa57b96c673ce"
          ACTUAL="$(git -C "$SRC" rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Submodule Kbase inesperado: $ACTUAL"
            exit 1
          fi
          COUNT="$(find "$SRC/patches" -type f -name '*.patch' | wc -l)"
          echo "PanVK kbase public source: $ACTUAL"
          echo "Public patch files retained: $COUNT"
          git submodule status "$SRC"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git curl wget unzip zip xz-utils \
            pkg-config gettext-base \
            python3 python3-dev python3-venv python3-pip \
            cmake ninja-build \
            bison flex \
            clang llvm llvm-dev lld \
            libllvmspirvlib-18-dev \
            libclang-dev \
            libclc-18 libclc-18-dev \
            libdrm-dev libelf-dev \
            libexpat1-dev libzstd-dev zlib1g-dev \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols \
            libx11-dev libx11-xcb-dev \
            libxrandr-dev libxdamage-dev \
            libxfixes-dev libxext-dev libxxf86vm-dev \
            libxcb1-dev libxcb-randr0-dev \
            libxcb-dri3-dev libxcb-present-dev \
            libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-shm0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxshmfence-dev \
            libvulkan-dev libxml2-dev \
            libffi-dev libssl-dev \
            libedit-dev libncurses-dev \
            libudev-dev patchelf \
            glslang-tools

      - name: Verificar dependencias Wayland do Meson
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-egl-backend
          pkg-config --modversion LLVMSPIRVLib
          pkg-config --modversion xcb-glx
          pkg-config --modversion xcb-keysyms
          pkg-config --modversion xxf86vm
          test -f /usr/include/wayland-egl-backend.h

      - name: Instalar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Preparar caminho do NDK
        shell: bash
        run: |
          NDK_VERSION="27.0.12077973"
          mkdir -p "$HOME/Android/Sdk/ndk"

          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "NDK nao encontrado"
            exit 1
          fi

          ln -sfn \
            "$ANDROID_HOME/ndk/$NDK_VERSION" \
            "$HOME/Android/Sdk/ndk/$NDK_VERSION"

          echo "ANDROID_NDK_HOME=$HOME/Android/Sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Instalar Meson e ferramentas Python
        run: |
          python3 -m venv "$HOME/panvk-venv"

          "$HOME/panvk-venv/bin/pip" install --upgrade \
            pip setuptools wheel

          "$HOME/panvk-venv/bin/pip" install \
            "meson>=1.4,<2" \
            mako pyyaml ply packaging

          echo "$HOME/panvk-venv/bin" >> "$GITHUB_PATH"

      - name: Compilar e instalar libdrm 2.4.133 para o host
        shell: bash
        run: |
          set -euo pipefail

          LIBDRM_VERSION="2.4.133"
          ARCHIVE="libdrm-${LIBDRM_VERSION}.tar.xz"
          URL="https://dri.freedesktop.org/libdrm/${ARCHIVE}"
          SHA256="fc68f9d0ba2ea63c9432a299e14fea09fad7a8a66e8039fcd7802ca59f77b4f5"

          curl --fail --location --retry 3 "$URL" -o "/tmp/$ARCHIVE"
          echo "$SHA256  /tmp/$ARCHIVE" | sha256sum --check --status

          mkdir -p /tmp/libdrm-src
          tar -xf "/tmp/$ARCHIVE" -C /tmp/libdrm-src --strip-components=1

          meson setup /tmp/libdrm-src/build /tmp/libdrm-src \
            --prefix=/usr/local \
            --buildtype=release

          ninja -C /tmp/libdrm-src/build
          sudo ninja -C /tmp/libdrm-src/build install
          sudo ldconfig

          LIBDRM_PC="$(find /usr/local -type f -name libdrm.pc -print -quit)"
          if [ -z "$LIBDRM_PC" ]; then
            echo "libdrm.pc nao foi instalado"
            exit 1
          fi

          LIBDRM_PC_DIR="$(dirname "$LIBDRM_PC")"
          echo "PKG_CONFIG_PATH=$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --modversion libdrm
          PKG_CONFIG_PATH="$LIBDRM_PC_DIR:${PKG_CONFIG_PATH:-}" pkg-config --atleast-version=2.4.133 libdrm

      - name: Instalar Rust e Cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar bindgen e cbindgen para o Mesa
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked bindgen-cli --version 0.72.1
          cargo install --locked cbindgen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/bindgen" --version
          "$HOME/.cargo/bin/cbindgen" --version

      - name: Verificar ferramentas
        run: |
          clang --version
          llvm-config --version
          meson --version
          ninja --version
          rustc --version
          cargo --version
          bindgen --version
          cbindgen --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Verificar codigo-fonte
        shell: bash
        run: |
          set -euo pipefail
          for file in setup.sh android.toml meson.build; do
            if [ ! -f "$file" ]; then
              echo "Arquivo obrigatorio ausente: $file"
              exit 1
            fi
          done
          if [ ! -f src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c ]; then
            echo "Arquivo PanVK CSF nao encontrado."
            exit 1
          fi

      - name: Aplicar ajustes de heap MC7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("src/panfrost/vulkan/csf/panvk_vX_gpu_queue.c")
          source = path.read_text()
          import re

          interval = re.findall(
              r"^#define KBASE_TILER_HEAP_RENEW_INTERVAL (\d+)$",
              source, re.MULTILINE)
          work = re.findall(
              r"^#define KBASE_TILER_HEAP_RENEW_WORK (\d+)$",
              source, re.MULTILINE)
          if len(interval) != 1 or len(work) != 1:
              raise SystemExit(
                  f"Esperava exatamente uma definicao de cada macro; "
                  f"INTERVAL={interval}, WORK={work}")

          interval_value = int(interval[0])
          if interval_value != 256:
              source = re.sub(
                  r"^#define KBASE_TILER_HEAP_RENEW_INTERVAL \d+$",
                  "#define KBASE_TILER_HEAP_RENEW_INTERVAL 256",
                  source, count=1, flags=re.MULTILINE)
              print(f"Heap renew interval: {interval_value} -> 256")
          else:
              print("Heap renew interval: 256 (ja configurado)")

          work_value = int(work[0])
          target_work = 131072
          if work_value != target_work:
              source = re.sub(
                  r"^#define KBASE_TILER_HEAP_RENEW_WORK \d+$",
                  f"#define KBASE_TILER_HEAP_RENEW_WORK {target_work}",
                  source, count=1, flags=re.MULTILINE)
              work_status = f"{target_work} (alterado de {work_value})"
              print(f"Heap renew work: {work_value} -> {target_work}")
          else:
              work_status = f"{target_work} (ja configurado)"
              print(f"Heap renew work: {target_work} (ja configurado)")

          path.write_text(source)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"HEAP_RENEW_WORK_STATUS={work_status}\n")
          PY

      - name: Instrumentar apresentacao Android e submissao Kbase
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/instrument-display-path.py

      - name: Preparar script de compilacao
        shell: bash
        run: |
          set -euo pipefail
          chmod +x setup.sh

      - name: Compilar PanVK ARM64
        shell: bash
        run: |
          set -euo pipefail
          bash ./setup.sh
          meson compile -C build

      - name: Localizar biblioteca compilada
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(find build -type f -name libvulkan_panfrost.so -print -quit)"
          if [ -z "$LIB" ]; then
            echo "Biblioteca nao encontrada."
            exit 1
          fi
          mkdir -p output
          cp "$LIB" output/libvulkan_panfrost.so
          file output/libvulkan_panfrost.so
          sha256sum output/libvulkan_panfrost.so
          echo "Biblioteca compilada: $LIB"

      - name: Preparar meta.json do driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          test -s packaging/faux123-v1.1.9/meta.json
          cp packaging/faux123-v1.1.9/meta.json output/meta-faux123-v1.1.9.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("packaging/faux123-v1.1.9/meta.json").read_text())
          meta = dict(source)
          meta["name"] = "PanVK faux123 v1.1.9 - Mali-G720 MC7 adaptation"
          meta["description"] = (
              source["description"]
              + " Device adaptation: Mali-G720 MC7. "
              + "This build is an experimental derivative; G720 MC7 support "
              + "is not claimed by the original Faux123 v1.1.9 release."
          )
          meta["packageVersion"] = "v1.1.9-mc7"
          Path("output/meta.json").write_text(
              json.dumps(meta, indent=2, ensure_ascii=False) + "\n"
          )
          # Validate both files and required installer fields.
          for path in (Path("packaging/faux123-v1.1.9/meta.json"), Path("output/meta.json")):
              data = json.loads(path.read_text())
              for key in ("schemaVersion", "name", "packageVersion", "libraryName", "minApi"):
                  assert key in data and data[key] not in (None, "")
          PY
          echo "Original Faux123 metadata and MC7 package metadata prepared."
          sha256sum packaging/faux123-v1.1.9/meta.json output/meta-faux123-v1.1.9.json output/meta.json

      - name: Gerar informacoes do build
        run: |
          {
            echo "PanVK Mali G720 MC7"
            echo "Arquitetura: ARM64"
            echo "Android API: 30"
            echo "NDK: 27.0.12077973"
            echo "Heap renew interval: 256"
            echo "Heap renew work: $HEAP_RENEW_WORK_STATUS"
            echo ""
            echo "SHA256:"
            sha256sum output/libvulkan_panfrost.so
          } > output/BUILD-INFO.txt

      - name: Validar e empacotar driver ARM64
        run: |
          set -euo pipefail
          readelf -h output/libvulkan_panfrost.so | tee output/ELF.txt
          grep -Eq 'Class: +ELF64' output/ELF.txt
          grep -Eq 'Machine: +AArch64' output/ELF.txt
          readelf -d output/libvulkan_panfrost.so | tee output/ELF-DYNAMIC.txt
          readelf --dyn-syms --wide output/libvulkan_panfrost.so > output/ELF-SYMBOLS.txt
          grep -Eq 'GLOBAL.*DEFAULT.*[0-9]+ +vk_icdGetInstanceProcAddr$' output/ELF-SYMBOLS.txt
          python3 -c 'import json; from pathlib import Path; p=Path("output"); m=json.loads((p/"meta.json").read_text()); assert m["libraryName"]=="libvulkan_panfrost.so"; assert (p/m["libraryName"]).is_file(); m["name"]="PanVK Faux123 1.1.9 - G720 MC7 v22"; m["packageVersion"]="v1.1.9-mc7-v22"; (p/"meta.json").write_text(json.dumps(m,indent=2))'
          (cd output && zip -9 PanVK-Faux123-1.1.9-MC7-v22.adpkg.zip libvulkan_panfrost.so meta.json)
          unzip -tq output/PanVK-Faux123-1.1.9-MC7-v22.adpkg.zip

      - name: Publicar biblioteca compilada
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-MC7-v22-ARM64
          path: output/
          if-no-files-found: error
          retention-days: 30
